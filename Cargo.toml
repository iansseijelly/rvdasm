[package]
name = "rvdasm"
version = "0.4.0"
edition = "2021"
description = "A RISC-V disassembler written in Rust"
license = "MIT"
repository = "https://github.com/iansseijelly/rvdasm"
readme = "README.md"
keywords = ["risc-v", "disassembler", "isa"]
authors = ["iansseijelly <iansseijelly@berkeley.edu>"]
# Generating src/isa.rs needs the riscv-opcodes submodule, and the tests need their data; neither is needed to build.
exclude = ["riscv-opcodes", "tests", "scripts", ".vscode"]

[dependencies]
once_cell = "1.17.0"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
object = "0.36"
clap = { version = "4.5.32", features = ["derive"] }
log = "0.4.20"
regex = "1.9.1"